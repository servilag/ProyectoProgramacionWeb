{% extends 'post/base.html' %}
{% block content %}
<div class="container text-center my-5">
    <div class="card p-5 border-0 shadow-sm mx-auto" style="max-width: 400px;">
        <i class="bi bi-check-circle-fill text-success" style="font-size: 4rem;"></i>
        <h3 class="fw-bold mt-3">¡Pago Exitoso!</h3>
        <p class="text-muted">Redirigiendo a tu historial de compras...</p>
        <div class="spinner-border text-success mt-2" role="status"></div>
    </div>
</div>

<script>
    // Esto hace que el usuario vea la confirmación y se vaya al perfil solo
    setTimeout(function(){
        window.location.href = "{% url 'perfil' %}";
    }, 2500); 
</script>
{% endblock %}
